lane_detector:
  ros__parameters:

    # Without this the node's clock is wall time, so sim_t in the run log cannot
    # be joined against lpv_mpc's run.csv, which does run on sim time.
    use_sim_time: true

    # ── Topics ────────────────────────────────────────────────────────────────
    # Defaults match the sim; on the real car point camera_topic at the
    # realsense2_camera stream. Nothing else needs to change.
    camera_topic: '/camera/color/image_raw'
    camera_info_topic: '/camera/color/camera_info'
    odom_topic: '/ego_racecar/odom'
    ref_path_topic: '/planning/ref_path'
    debug_image_topic: '/lane_keeping/debug_image'
    publish_debug_image: true
    mpc_pred_topic: '/lpv_mpc_gazebo/pred_path'

    # ── Camera extrinsics — THE calibration that matters most ─────────────────
    # THESE MUST MATCH sim_launch's camera_mount_z / camera_pitch args (set in
    # f1tenth_gym_gazebo/config/sim.yaml). If they drift apart the ground
    # projection is silently wrong and every lane offset is garbage.
    # Raised from 0.2025 to 0.40 m: at 0.2025 the usable range was ~2.15 m,
    # short of x_max 3.0, which starved the fit in corners (41% of corner ticks
    # produced zero bins). At 0.40 m usable range is ~3.05 m.
    # MEASURE these on the real car: 1 deg of pitch error moves a 3 m ground
    # reading to ~2.35 m, a 22% range error.
    # Intrinsics are NOT here — they are read from camera_info at runtime, so
    # this works at any resolution and on the real camera unchanged.
    cam_height: 0.40
    cam_pitch: 0.0463
    cam_x: 0.275

    # ── White-paint threshold ─────────────────────────────────────────────────
    # Adaptive: max(white_min, mean + white_k*std) over the cropped road region,
    # so sim lighting and real tape both work without re-tuning. On the sim
    # frame this lands at ~205, cleanly between grey road (p50=155) and paint
    # (p99=255). Lower white_min for dim indoor tape.
    white_k: 2.0
    white_min: 140.0
    # A run is dropped if its two endpoints project more than this far apart on
    # the ground. Markings are 0.08 m wide; anything much wider is glare or a
    # sunlit wall, not a lane line.
    max_paint_width_m: 0.20

    # ── Sampling window ───────────────────────────────────────────────────────
    # x_min is raised automatically at runtime to lane_min_range() (~0.72 m for
    # this FOV) because nearer than that BOTH lane lines fall outside the
    # horizontal FOV and the bins are always empty. Set it lower freely; it is a
    # floor, not a target.
    # x_max past ~3 m buys nothing: at a 0.2 m mount the ground from 3 m to the
    # horizon occupies ~42 of 480 image rows.
    n_rows: 48
    n_bins: 8
    x_min: 0.40
    x_max: 3.00
    y_max: 2.00

    # ── Lane model ────────────────────────────────────────────────────────────
    # Measured off superspeedway/model.sdf: dashed lines at +/-0.49 m and solid
    # edges at +/-1.44 m, so the middle lane is 1.00 m and the outer two 0.95 m.
    # Used ONLY as the fallback when a single line is visible — which is common,
    # since the dashes have 0.32 m gaps. Ignored when both lines are seen.
    lane_width: 1.00
    min_bins: 3
    # Fit sanity bounds. max_abs_c caps curvature (2c ~ kappa; the track's
    # tightest turn is kappa=0.2025). max_abs_b caps heading error (0.70 ~ 35
    # deg). Past either, assume the wrong markings were latched: the fit is
    # rejected and the last good one held.
    max_abs_b: 0.70
    max_abs_c: 0.15

    # ── Output horizon ────────────────────────────────────────────────────────
    # lpv_mpc_node accepts an arc length of 1..60 m; x_min..x_max gives ~2.3 m.
    n_ref: 20
    # Publish the horizon starting at the CAR, not at x_min. The fit still uses
    # x_min (the camera cannot see nearer), but the car is physically on the
    # lane between 0 and x_min, so evaluating the same quadratic there is
    # interpolation toward the car. Without it lpv_mpc aimed 2.69 m out on a
    # 2.3 m horizon (118% of its length) and began turning ~2 m before the
    # corner, driving the car out of the lane on the straight.
    ref_start_m: 0.0
    # The ONE speed knob — lane_keeping_launch.py forces the MPC's speed_scale
    # to 1.0 so the tuned YAML's 0.55 cannot silently scale this.
    target_speed: 1.5
    a_lat_max: 3.0
    # Temporal smoothing on the fit: coef = alpha*new + (1-alpha)*prev. Also
    # seeds the next frame's near-to-far bracketing. Lower = steadier line.
    ema_alpha: 0.35
    publish_rate_hz: 20.0
    # Consecutive undetected frames before commanding HOLD (vx=0), which stops
    # the car. At 20 Hz this is 0.5 s.
    blind_ticks_stop: 10

    # ── Run logging ───────────────────────────────────────────────────────────
    # CSV is the ONLY run record — rosbag recording was removed from both launch
    # files. One row per tick into log_dir/lane_<timestamp>.csv: measured pose,
    # how much paint was found, whether the fit was accepted, the lane model, the
    # full reference horizon published to the MPC (ref_hx/ref_hy) and the MPC's
    # own predicted path that came back (pred_hx/pred_hy), so reference-vs-
    # -followed is answerable from this one file. Enough on its own to score a
    # run offline against ground_truth/<map>_lane_<name>.csv.
    # lane_keeping_launch.py overrides log_dir to src/lane_assist/log.
    enable_csv_log: true
    log_dir: ''
